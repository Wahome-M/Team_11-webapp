openapi: 3.0.0
info:
  title: FundiLink API
  version: 1.2.0
  description: >
    API for FundiLink, a platform connecting employers who need short-term
    casual work done with verified local workers ("fundis"). Employers post
    jobs, workers apply to them (a "booking"), and employers track and update
    each booking's status.


    **Authentication:** every endpoint needs an API key in the `X-API-Key`
    header. A missing or wrong key gets `401`. Each consumer gets its own key
    from our team, sent privately. `GET /` (health check) is the only open
    path. `POST /users/login` only checks a user's email and password; it is
    not how you authenticate to the API and does not issue a token.


    **Rate limit:** 100 requests per minute per key. Going over returns `429`
    with a `Retry-After` header (seconds to wait) and a JSON body.


    **Errors:** every failed request returns JSON with an `error` message.
    Validation failures (400) also include a `details` array listing each
    problem. Check the HTTP status code first: 2xx is success, anything else
    is a failure.

security:
  - ApiKeyAuth: []   # every operation needs a key unless it overrides this

servers:
  - url: http://localhost:5000
    description: Local development server (see README.md to run it)

tags:
  - name: Health
    description: Is the server up?
  - name: Users
    description: Worker and employer accounts
  - name: Jobs
    description: Job postings created by employers
  - name: Bookings
    description: A worker's application to a job, and its status

paths:
  /:
    get:
      operationId: healthCheck
      tags: [Health]
      summary: Health check (no key needed)
      description: Returns a fixed text message and no data, so anyone can check the server is up.
      security: []
      responses:
        '200':
          description: The server is running.
          content:
            text/html:
              schema:
                type: string
              example: FundiLink API is running

  /users:
    get:
      operationId: searchUsers
      tags: [Users]
      summary: Search users (e.g. find verified plumbers in Westlands)
      description: >
        All filters are optional and can be combined. With no filters, every
        user is returned. Results leave out `email` so a caller can't collect
        every user's email in one request; use `GET /users/{id}` for a full
        profile.
      parameters:
        - name: role
          in: query
          description: Filter by account type.
          schema:
            type: string
            enum: [worker, employer]
          example: worker
        - name: trade
          in: query
          description: Filter workers by trade (exact match).
          schema:
            type: string
          example: plumbing
        - name: location
          in: query
          description: Filter by location (partial match, case-insensitive).
          schema:
            type: string
          example: Westlands
        - name: verified
          in: query
          description: Only verified (`true`) or only unverified (`false`) accounts.
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: Matching users. An empty array if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
              example:
                - id: 1
                  firstName: John
                  lastName: Kamau
                  role: worker
                  trade: plumbing
                  location: Westlands, Nairobi
                  verified: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createUser
      tags: [Users]
      summary: Register a new worker or employer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
            example:
              firstName: Amina
              lastName: Hassan
              email: amina@example.com
              password: secret1
              role: worker
              trade: painting
              location: South B, Nairobi
      responses:
        '201':
          description: >
            The user was created. The password is stored hashed and never
            returned. New users always start with `verified: false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 5
                firstName: Amina
                lastName: Hassan
                email: amina@example.com
                role: worker
                trade: painting
                location: South B, Nairobi
                verified: false
        '400':
          description: A required field is missing or has the wrong type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation failed
                details:
                  - lastName is required and must be a string
                  - password is required and must be a string
        '409':
          $ref: '#/components/responses/EmailTaken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUser
      tags: [Users]
      summary: Get one user's profile
      responses:
        '200':
          description: The requested user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                firstName: John
                lastName: Kamau
                email: john@example.com
                role: worker
                trade: plumbing
                location: Westlands, Nairobi
                verified: true
        '404':
          $ref: '#/components/responses/UserNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: updateUser
      tags: [Users]
      summary: Replace a user's profile
      description: >
        Send the full profile. `firstName`, `lastName`, `email` and `role` are
        required. Omitted optional fields (`trade`, `location`) are cleared.
        `password` is optional here; if omitted, the existing password is kept.
        `verified` cannot be changed through the API and is ignored if sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            example:
              firstName: John
              lastName: Kamau
              email: john@example.com
              role: worker
              trade: plumbing
              location: Parklands, Nairobi
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete a user
      description: Also deletes that user's bookings. Jobs they posted stay, with `employerId` set to null.
      responses:
        '204':
          description: Deleted. The response has no body.
        '404':
          $ref: '#/components/responses/UserNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /users/login:
    post:
      operationId: login
      tags: [Users]
      summary: Check an email and password
      description: Returns the matching user. No token is issued yet (Week 9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: john@example.com
              password: password123
      responses:
        '200':
          description: Correct credentials. Returns the user (without password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Email or password missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email and password are required
        '401':
          description: Missing or invalid API key, or no user with that email and password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badKey:
                  summary: No API key or a wrong one
                  value:
                    error: Missing or invalid API key
                badCredentials:
                  summary: Wrong email or password
                  value:
                    error: Invalid email or password
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /jobs:
    get:
      operationId: listJobs
      tags: [Jobs]
      summary: Browse active job postings
      parameters:
        - name: category
          in: query
          description: Only jobs in this category (exact match).
          schema:
            type: string
          example: plumbing
      responses:
        '200':
          description: Active jobs. An empty array if none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
              example:
                - id: 1
                  title: Fix leaking kitchen sink
                  category: plumbing
                  location: Westlands, Nairobi
                  pay: 1500
                  payType: fixed
                  urgent: true
                  duration: ~2 hours
                  employerId: 2
                  employer: Peter Mwangi
                  description: The kitchen sink has been dripping for 3 days. Need someone to replace the tap washer.
                  isActive: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createJob
      tags: [Jobs]
      summary: Post a new job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewJob'
            example:
              title: Paint front gate
              category: painting
              location: Kilimani, Nairobi
              pay: 2000
              employerId: 2
      responses:
        '201':
          description: The job was created. Returns the stored record, including defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                id: 3
                title: Paint front gate
                category: painting
                location: Kilimani, Nairobi
                pay: 2000
                payType: fixed
                urgent: false
                duration: null
                employerId: 2
                employer: null
                description: null
                isActive: true
        '400':
          description: >
            Missing or invalid field, `employerId` that doesn't exist, or a
            body that isn't valid JSON. Nothing is saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingField:
                  summary: Missing or invalid required field
                  value:
                    error: Validation failed
                    details:
                      - title, category, location and pay (a non-negative number) are required
                unknownEmployer:
                  summary: employerId doesn't exist
                  value:
                    error: Validation failed
                    details:
                      - employerId does not match an existing user
                badJson:
                  summary: Body is not valid JSON
                  value:
                    error: Request body is not valid JSON
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /jobs/{id}/bookings:
    get:
      operationId: listJobBookings
      tags: [Jobs]
      summary: List everyone who applied to a job
      parameters:
        - name: id
          in: path
          required: true
          description: The job's numeric ID.
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: All bookings for this job. An empty array if nobody has applied.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
              example:
                - id: 1
                  jobId: 1
                  workerId: 1
                  workerName: John Kamau
                  status: pending
                  appliedAt: "2026-09-09T04:15:00.000Z"
        '404':
          $ref: '#/components/responses/JobNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /bookings:
    post:
      operationId: createBooking
      tags: [Bookings]
      summary: Apply to a job (creates a pending booking)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBooking'
            example:
              jobId: 1
              workerId: 4
              workerName: Brian Otieno
      responses:
        '201':
          description: The booking was created with status `pending`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                id: 3
                jobId: 1
                workerId: 4
                workerName: Brian Otieno
                status: pending
                appliedAt: "2026-10-13T18:43:17.000Z"
        '400':
          description: '`jobId` or `workerId` missing or not a positive integer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation failed
                details:
                  - jobId is required and must be a positive integer
                  - workerId is required and must be a positive integer
        '404':
          description: The job or the worker doesn't exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Job not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

  /bookings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The booking's numeric ID.
        schema:
          type: integer
        example: 1
    get:
      operationId: getBooking
      tags: [Bookings]
      summary: Check one booking's status
      responses:
        '200':
          description: The requested booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                id: 1
                jobId: 1
                workerId: 1
                workerName: John Kamau
                status: pending
                appliedAt: "2026-09-09T04:15:00.000Z"
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: updateBookingStatus
      tags: [Bookings]
      summary: Change a booking's status (e.g. confirm a worker)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, rejected, completed]
            example:
              status: confirmed
      responses:
        '200':
          description: The updated booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                id: 1
                jobId: 1
                workerId: 1
                workerName: John Kamau
                status: confirmed
                appliedAt: "2026-09-09T04:15:00.000Z"
        '400':
          description: '`status` is missing or not one of the allowed values.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation failed
                details:
                  - 'status must be one of: pending, confirmed, rejected, completed'
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: The user's numeric ID.
      schema:
        type: integer
      example: 1

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Your API key. Each consumer gets its own, sent privately by our team.
        Never put a real key in code, a README or a public channel.

  responses:
    Unauthorized:
      description: No `X-API-Key` header, or the key isn't valid. Nothing was done.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Missing or invalid API key
    TooManyRequests:
      description: >
        This key made more than 100 requests in the current minute. Wait the
        number of seconds in `Retry-After`, then try again.
      headers:
        Retry-After:
          description: Seconds to wait before the next request.
          schema:
            type: integer
            example: 42
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Too many requests
            retryAfter: 42
    ValidationError:
      description: A required field is missing or has the wrong type. Nothing is saved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Validation failed
            details:
              - email is required and must be a string
    UserNotFound:
      description: No user has that ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: User not found
    JobNotFound:
      description: No job has that ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Job not found
    BookingNotFound:
      description: No booking has that ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Booking not found
    EmailTaken:
      description: Another user already has this email.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Email already registered
    ServerError:
      description: Unexpected server or database error (for example, MySQL isn't running).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Failed to fetch users

  schemas:
    User:
      type: object
      required: [id, firstName, lastName, email, role, verified]
      properties:
        id:
          type: integer
          example: 1
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Kamau
        email:
          type: string
          format: email
          example: john@example.com
        role:
          type: string
          enum: [worker, employer]
        trade:
          type: string
          nullable: true
          description: Worker's trade. Null for employers.
          example: plumbing
        location:
          type: string
          nullable: true
          example: Westlands, Nairobi
        verified:
          type: boolean
          example: true

    UserSummary:
      type: object
      description: A user as returned by search. Same as User, without email.
      required: [id, firstName, lastName, role, verified]
      properties:
        id:
          type: integer
          example: 1
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Kamau
        role:
          type: string
          enum: [worker, employer]
        trade:
          type: string
          nullable: true
          example: plumbing
        location:
          type: string
          nullable: true
          example: Westlands, Nairobi
        verified:
          type: boolean
          example: true

    NewUser:
      type: object
      required: [firstName, lastName, email, password, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
          description: Must be unique.
        password:
          type: string
        role:
          type: string
          enum: [worker, employer]
          description: Must be worker or employer.
        trade:
          type: string
        location:
          type: string
      description: Any other field (such as `id` or `verified`) is ignored.

    UserUpdate:
      type: object
      required: [firstName, lastName, email, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          description: Optional. Omit to keep the current password.
        role:
          type: string
          enum: [worker, employer]
        trade:
          type: string
        location:
          type: string

    Job:
      type: object
      required: [id, title, category, location, pay, payType, urgent, isActive]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Fix leaking kitchen sink
        category:
          type: string
          example: plumbing
        location:
          type: string
          example: Westlands, Nairobi
        pay:
          type: number
          description: Amount in KES.
          example: 1500
        payType:
          type: string
          example: fixed
        urgent:
          type: boolean
        duration:
          type: string
          nullable: true
          example: ~2 hours
        employerId:
          type: integer
          nullable: true
          example: 2
        employer:
          type: string
          nullable: true
          description: Employer's display name, shown on job cards.
          example: Peter Mwangi
        description:
          type: string
          nullable: true
        isActive:
          type: boolean

    NewJob:
      type: object
      required: [title, category, location, pay]
      properties:
        title:
          type: string
        category:
          type: string
        location:
          type: string
        pay:
          type: number
          minimum: 0
          description: Amount in KES. Must be a JSON number, not a string.
        payType:
          type: string
          default: fixed
        urgent:
          type: boolean
          default: false
        duration:
          type: string
        employerId:
          type: integer
          description: Optional, but if given it must be an existing user's ID.
        employer:
          type: string
        description:
          type: string

    Booking:
      type: object
      required: [id, jobId, workerId, status, appliedAt]
      properties:
        id:
          type: integer
          example: 1
        jobId:
          type: integer
          example: 1
        workerId:
          type: integer
          example: 1
        workerName:
          type: string
          nullable: true
          example: John Kamau
        status:
          type: string
          enum: [pending, confirmed, rejected, completed]
        appliedAt:
          type: string
          format: date-time

    NewBooking:
      type: object
      required: [jobId, workerId]
      properties:
        jobId:
          type: integer
          description: Must be an existing job.
        workerId:
          type: integer
          description: Must be an existing user.
        workerName:
          type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Validation failed
        details:
          type: array
          description: Only on 400 validation errors. One entry per problem.
          items:
            type: string
        retryAfter:
          type: integer
          description: Only on 429. Seconds to wait before trying again.
