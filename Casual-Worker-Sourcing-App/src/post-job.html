<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="dashboard.css">
  <title>Post a Job · FundiLink</title>
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">FundiLink</a>
      <ul class="nav-menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="jobs.html">Browse Jobs</a></li>
        <li><a href="opportunities.html">Homes needing a fundi</a></li>
        <li><a href="#" id="logoutBtn" class="btn-nav">Log Out</a></li>
      </ul>
    </nav>
  </header>

  <div class="dash-hero">
    <h1>Post a job</h1>
    <p>Describe the work. Verified fundis near you can apply straight away.</p>
  </div>

  <div class="dash-container">
    <form id="jobForm" class="panel form-card" novalidate>
      <div class="form-group">
        <label for="jobTitle">Job title</label>
        <input type="text" id="jobTitle" placeholder="e.g. Fix leaking kitchen sink" required maxlength="255">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="jobCategory">Category</label>
          <select id="jobCategory" required>
            <option value="" selected disabled>Choose a trade</option>
            <option value="plumbing">Plumbing</option>
            <option value="electrical">Electrical</option>
            <option value="cleaning">Cleaning</option>
            <option value="carpentry">Carpentry</option>
            <option value="painting">Painting</option>
            <option value="masonry">Masonry</option>
            <option value="cooking">Cooking</option>
            <option value="security">Security</option>
            <option value="driving">Driving</option>
          </select>
        </div>
        <div class="form-group">
          <label for="jobLocation">Location</label>
          <input type="text" id="jobLocation" placeholder="e.g. Kilimani, Nairobi" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="jobPay">Pay (KES)</label>
          <input type="number" id="jobPay" min="0" step="50" placeholder="1500" required>
        </div>
        <div class="form-group">
          <label for="jobPayType">Pay type</label>
          <select id="jobPayType">
            <option value="fixed" selected>Fixed price</option>
            <option value="hourly">Per hour</option>
            <option value="daily">Per day</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="jobDuration">How long it should take</label>
        <input type="text" id="jobDuration" placeholder="e.g. ~2 hours">
      </div>
      <div class="form-group">
        <label for="jobDescription">Details</label>
        <textarea id="jobDescription" placeholder="What needs doing, anything the fundi should bring…"></textarea>
      </div>
      <label class="form-check"><input type="checkbox" id="jobUrgent"> Urgent: I need someone today</label>
      <button type="submit" class="btn-submit" id="jobSubmit">Post job</button>
    </form>
  </div>

  <footer>
    <p><strong>FundiLink</strong> · Built by Team 11 · Nairobi, Kenya · 2026</p>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="jobs.html">Browse Jobs</a>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="post-job.js"></script>
  <script src="main.js"></script>
</body>
</html>
