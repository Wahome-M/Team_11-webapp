<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FundiLink API · Swagger UI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>body { margin: 0; background: #fff; } .topbar { display: none; }</style>
</head>
<body>
  <!-- Served by our API at /docs. Reads /openapi.yaml from the same server, so "Try it out"
       calls this server. Click "Authorize" and paste an API key first; it stays in this tab only. -->
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: '/openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      persistAuthorization: false, // never keep a key in the browser after the tab closes
      tryItOutEnabled: true,
    });
  </script>
</body>
</html>
